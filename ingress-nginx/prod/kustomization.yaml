apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base-4.8.3

patches:
# Apply the static IP addresses
- target:
    kind: Service
    name: ingress-nginx-controller
  patch: |-
    - op: replace
      path: /metadata/annotations/service.beta.kubernetes.io~1azure-load-balancer-ipv4
      value: "57.165.167.88"
    - op: add
      path: /metadata/annotations/service.beta.kubernetes.io~1azure-dns-label-name
      value: "david-argocd-lab"